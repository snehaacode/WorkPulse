
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkPulse</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172554;
    }

    header {
      background: #172554;
      color: white;
      padding: 22px;
      text-align: center;
    }

    main {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 3px 12px #0001;
    }

    button {
      background: #2563eb;
      color: white;
      border: 0;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <header>
    <h1>WorkPulse</h1>
    <p>Employee & Project Management</p>
  </header>

  <main>
    <div class="card">
      <h2>Welcome to WorkPulse!</h2>
      <p>Manage projects, tasks and progress in one place.</p>
      <button onclick="showMessage()">Test App</button>
      <p id="message"></p>
    </div>
  </main>

  <script>
    function showMessage() {
      document.getElementById("message").textContent =
        "WorkPulse is working!";
    }
  </script>
</body>
</html>
